# .github/workflows/release.yml
#
# 发布工作流：打 tag vX.Y.Z 触发。
# 1. GoReleaser 跨平台编译 + 打包 + 上传 Release
# 2. 用 GitHub Actions 的 `scoop bucket` 更新个人 bucket 的 manifest（自动算 hash、自动提交）
#
# 需要仓库 Secret：
#   SCOOP_BUCKET_TOKEN —— 一个有 XiaTian-AC-bucket 仓库写权限的 PAT
#   （因为工作流用的 GITHUB_TOKEN 默认不能推送其他仓库）

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Leave empty to use the latest tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 手动 dispatch 时跳过 goreleaser（tag 已存在，Release 已生成），
      # 但 still run tests 已在上一步执行，仅用于验证。

  update-scoop-bucket:
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Checkout the SOURCE repo (contains .scoop/faster-dooit.json.tmpl).
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute release version
        id: ver
        run: |
          # 从 tag（v0.1.0）或手动输入取版本号
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Render manifest from template
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # 只填版本，SHA 由下一步从 checksums 提取后填入
          sed "s/__VERSION__/${VERSION}/g" \
            .scoop/faster-dooit.json.tmpl > manifest.json

      # Update the personal bucket via the GitHub Contents API. The token
      # must be a PAT (or fine-grained token) with write access to the
      # XiaTian-AC-bucket repository — set it as a repo secret
      # named SCOOP_BUCKET_TOKEN.
      - name: Publish manifest to scoop bucket
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # 从 checksums.txt 取 windows zip 的真实 sha256
          SHA=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${TAG}/checksums.txt" \
            | awk '$2=="faster-dooit-windows-amd64.zip"{print $1}')
          if [ -z "$SHA" ]; then
            echo "::error::Failed to extract SHA256 from checksums.txt for ${TAG}"
            exit 1
          fi
          sed -i "s/__SHA256__/${SHA}/g" manifest.json
          grep -q "sha256:${SHA}" manifest.json || { echo "::error::SHA256 placeholder not substituted"; exit 1; }
          # 读现有文件 sha 用于更新（首次可能不存在，容错）
          EXISTING_SHA=$(curl -fsSL \
            -H "Authorization: token ${SCOOP_BUCKET_TOKEN}" \
            "https://api.github.com/repos/XiaTian-AC/XiaTian-AC-bucket/contents/faster-dooit.json" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
          PAYLOAD="{\"message\":\"Release v${VERSION}\",\"content\":\"$(base64 -w0 manifest.json)\""
          if [ -n "$EXISTING_SHA" ]; then PAYLOAD="$PAYLOAD,\"sha\":\"$EXISTING_SHA\""; fi
          PAYLOAD="$PAYLOAD,\"branch\":\"main\"}"
          curl -fsSL -X PUT \
            -H "Authorization: token ${SCOOP_BUCKET_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/XiaTian-AC/XiaTian-AC-bucket/contents/faster-dooit.json"
