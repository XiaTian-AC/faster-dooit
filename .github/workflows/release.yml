# .github/workflows/release.yml
#
# 发布工作流：打 tag vX.Y.Z 触发。
# 1. GoReleaser 跨平台编译 + 打包 + 上传 Release
# 2. 用 GitHub Actions 的 `scoop bucket` 更新个人 bucket 的 manifest（自动算 hash、自动提交）
#
# 需要仓库 Secret：
#   SCOOP_BUCKET_TOKEN —— 一个有 scoop-faster-dooit 仓库写权限的 PAT
#   （因为工作流用的 GITHUB_TOKEN 默认不能推送其他仓库）

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-scoop-bucket:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Compute release version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute artifact SHA256
        id: hash
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/faster-dooit-windows-amd64.zip"
          curl -fsSL "$URL" -o fdooit.zip
          echo "sha256=$(sha256sum fdooit.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout scoop bucket
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          git clone "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/XiaTian-AC/scoop-faster-dooit.git" bucket
          cd bucket

      - name: Render manifest from template
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          # 模板在上层仓库，先复制进 bucket 再用 sed 填占位符
          cp .scoop/faster-dooit.json.tmpl bucket/faster-dooit.json
          cd bucket
          sed -i "s/__VERSION__/${VERSION}/g; s/__SHA256__/${SHA256}/g" faster-dooit.json

      - name: Commit manifest
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faster-dooit.json
          git commit -m "Release v${{ steps.ver.outputs.version }}" || true
          git push origin HEAD:main
